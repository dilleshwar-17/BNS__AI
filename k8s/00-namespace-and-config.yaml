apiVersion: v1
kind: Namespace
metadata:
  name: bnsai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnsai-config
  namespace: bnsai
data:
  DATABASE_URL: "postgresql+asyncpg://bnsai:$(POSTGRES_PASSWORD)@postgres:5432/bnsai"
  REDIS_URL: "redis://redis:6379/0"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  LOG_LEVEL: "WARNING"
  CORS_ORIGINS: "https://bnsai.example.com"
  ENVIRONMENT: "production"
  CSP_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com;"
  RATE_LIMIT_PER_MINUTE: "120"
  MAX_UPLOAD_SIZE_MB: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: bnsai-secrets
  namespace: bnsai
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  NEO4J_PASSWORD: "CHANGE_ME"
  SECRET_KEY: "CHANGE_ME"
  GEMINI_API_KEY: ""
  CHROMA_TOKEN: "CHANGE_ME"
