name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bnsai-api:latest ./backend
      - name: Build frontend image
        run: docker build -t bnsai-frontend:latest ./frontend
      - name: Test compose
        run: docker-compose config -q
