<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNS AI - Indian Legal Assistant</title>
    <link rel="preload" href="/css/bundle.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/css/bundle.css"></noscript>
    <link rel="stylesheet" href="/css/animations-enhanced.css">
    <style>
        body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#0f172a;min-height:100vh}#app{display:flex;flex-direction:column;min-height:100vh}.loader{border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite}.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px}.loading-screen p{margin:0;color:#94a3b8;font-size:14px}@keyframes spin{to{transform:rotate(360deg)}}nav{display:flex;align-items:center;padding:0 24px;height:64px;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100}.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer}.nav-logo{font-size:22px}.nav-title{font-size:18px;font-weight:700;color:#0f172a;letter-spacing:-0.3px}.nav-links{display:flex;gap:2px;margin-left:auto}.nav-link{color:#475569;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:all .15s}.nav-link:hover{color:#0f172a;background:#f1f5f9}.nav-actions{display:flex;align-items:center;gap:10px;margin-left:auto}.icon-btn{background:none;border:1px solid #e2e8f0;font-size:16px;cursor:pointer;padding:7px;border-radius:8px;transition:all .15s;width:34px;height:34px;display:flex;align-items:center;justify-content:center}.icon-btn:hover{background:#f8fafc}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;border:1px solid transparent;font-family:inherit}.btn-primary{background:#1e3a5f;color:#fff;border-color:#1e3a5f}.btn-primary:hover{background:#0f1f3d}.btn-outline{background:transparent;color:#0f172a;border-color:#e2e8f0}.btn-outline:hover{border-color:#2563eb;color:#2563eb}
    </style>
</head>
<body>
    <div id="app">
        <nav id="navbar">
            <div class="nav-brand" onclick="router.navigate('/')">
                <span class="nav-logo">⚖️</span>
                <span class="nav-title">BNS AI</span>
            </div>
            <div class="nav-links" id="nav-links">
                <a href="#/chat" class="nav-link" onclick="router.navigate('/chat')">Chat</a>
                <a href="#/drafting" class="nav-link" onclick="router.navigate('/drafting')">Drafting</a>
                <a href="#/dashboard" class="nav-link" onclick="router.navigate('/dashboard')">Dashboard</a>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" onclick="app.toggleTheme()">🌙</button>
            </div>
        </nav>
        <main id="main-content">
            <div class="loading-screen" id="loading-screen">
                <div class="loader"></div>
                <p>Loading BNS AI...</p>
            </div>
        </main>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
