services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bnsai}
      POSTGRES_USER: ${POSTGRES_USER:-bnsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bnsai_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    networks:
      - bnsai_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - neo4j_data:/data
    networks:
      - bnsai_network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.0
    environment:
      IS_PERSISTENT: TRUE
      PERSIST_DIRECTORY: /data/chroma
      ANONYMIZED_TELEMETRY: FALSE
    volumes:
      - chroma_data:/data
    networks:
      - bnsai_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bnsai_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bnsai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-bnsai}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      OLLAMA_BASE_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ENVIRONMENT: production
      # --- Pool sizing (raised from dev defaults for concurrent load) ---
      POOL_SIZE: ${POOL_SIZE:-50}
      MAX_OVERFLOW: ${MAX_OVERFLOW:-100}
      POOL_PRE_PING: ${POOL_PRE_PING:-true}
      # --- Worker count override for gunicorn ------------------------------
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
    depends_on:
      - postgres
      - redis
      - neo4j
      - chroma
    networks:
      - bnsai_network
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: ${API_CPUS_LIMIT:-4}
          memory: 2G
        reservations:
          cpus: ${API_CPUS_RESERVE:-1}
          memory: 512M

  loadtest:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir httpx psutil &&
             python load_test.py --host api --port 8000
               --users $${LOAD_USERS:-3000}
               --rise $${LOAD_RISE:-1000}
               --duration $${LOAD_DURATION:-45}
               --out /tmp/LOAD_REPORT.md"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    working_dir: /app
    depends_on:
      - api
    networks:
      - bnsai_network
    profiles:
      - loadtest

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - bnsai_network
    restart: unless-stopped

networks:
  bnsai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  chroma_data:
  ollama_data:
